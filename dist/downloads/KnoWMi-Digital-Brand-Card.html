<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnoWMi — Official Digital Brand Card</title>
    <meta name="description" content="Official Digital Identity Brand Card powered by KnoWMi Phygital Ecosystem. Scan Me. Know Me.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-orange: #F97316;
            --brand-orange-bright: #FF9933;
            --brand-dark: #05050A;
            --brand-card-bg: #0E0E16;
            --brand-glass: rgba(255, 255, 255, 0.04);
            --brand-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--brand-dark);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(249, 115, 22, 0.12), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.12), transparent 45%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            perspective: 1000px;
        }

        .brand-card {
            background: linear-gradient(160deg, #141420 0%, #08080E 100%);
            border: 3px solid #FFFFFF;
            border-radius: 36px;
            padding: 36px 28px;
            box-shadow: 10px 10px 0px var(--brand-orange), 0 30px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .brand-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--brand-orange-bright), #FFD700, var(--brand-orange));
        }

        /* Ambient Glow Pill */
        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(249, 115, 22, 0.12);
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 100px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--brand-orange-bright);
            margin-bottom: 24px;
        }

        .dot-online {
            width: 7px;
            height: 7px;
            background-color: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10B981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Brand Logo Area */
        .brand-logo-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo-img {
            max-width: 220px;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(249, 115, 22, 0.3));
        }

        .brand-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: uppercase;
            color: #FFFFFF;
            margin-top: 8px;
        }

        .brand-title span {
            color: var(--brand-orange);
            font-style: italic;
        }

        .slogan {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        /* QR Code Container */
        .qr-card-box {
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            margin: 24px 0;
            box-shadow: 5px 5px 0px #000000;
            position: relative;
        }

        .qr-card-box img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 12px;
        }

        .qr-subtext {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #000000;
            margin-top: 12px;
        }

        /* Link Buttons */
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 28px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            padding: 16px 20px;
            border-radius: 18px;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .btn-link:hover {
            background: #FFFFFF;
            color: #000000;
            border-color: #FFFFFF;
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px var(--brand-orange);
        }

        .btn-primary {
            background: var(--brand-orange);
            color: #000000;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px #FFFFFF;
        }

        .btn-primary:hover {
            background: #FFFFFF;
            color: #000000;
            box-shadow: 4px 4px 0px var(--brand-orange);
        }

        /* Footer */
        .footer {
            margin-top: 28px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .footer-text {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
        }

        .footer-badge {
            margin-top: 8px;
            display: inline-block;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--brand-orange-bright);
            background: rgba(249, 115, 22, 0.1);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid rgba(249, 115, 22, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-card">
            <!-- Header Status -->
            <div style="text-align: center;">
                <div class="badge-pill">
                    <span class="dot-online"></span>
                    Phygital Identity Protocol Active
                </div>
            </div>

            <!-- Logo Section -->
            <div class="brand-logo-container">
                <img src="/downloads/KnoWMi-Logo.webp" alt="KnoWMi Official Logo" class="brand-logo-img" onerror="this.onerror=null; this.src='/assets/logo.png';">
                <div class="slogan">Scan Me. Know Me.</div>
            </div>

            <!-- QR Code Badge -->
            <div class="qr-card-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://knowmi.in" alt="KnoWMi Official QR Code">
                <div class="qr-subtext">✦ Tap or Scan to Connect ✦</div>
            </div>

            <!-- Links Group -->
            <div class="links-group">
                <a href="https://knowmi.in" target="_blank" class="btn-link btn-primary">
                    <span>🌐 Official Website</span>
                    <span>→</span>
                </a>
                <a href="https://knowmi.in/#pricing" target="_blank" class="btn-link">
                    <span>👕 Shop Collection</span>
                    <span>→</span>
                </a>
                <a href="https://knowmi.in/track" target="_blank" class="btn-link">
                    <span>📦 Track Order Status</span>
                    <span>→</span>
                </a>
                <a href="https://wa.me/917981325397" target="_blank" class="btn-link">
                    <span>💬 WhatsApp Support</span>
                    <span>→</span>
                </a>
            </div>

            <!-- Footer -->
            <div class="footer">
                <div class="footer-text">© 2026 KnoWMi Ecosystem</div>
                <div class="footer-badge">Authentic Phygital Apparel</div>
            </div>
        </div>
    </div>

</body>
</html>
